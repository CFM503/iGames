name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug & Release APK
        run: |
          gradle assembleRelease assembleDebug --stacktrace

      - name: Organize APK Files
        run: |
          mkdir -p build-apks
          # Find generated APKs and copy with friendly names
          find app/build/outputs/apk/ -name "*.apk" -type f
          cp app/build/outputs/apk/release/*.apk build-apks/iGames-release.apk || true
          cp app/build/outputs/apk/debug/*.apk build-apks/iGames-debug.apk || true
          ls -la build-apks/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iGames-Android-APKs
          path: build-apks/*.apk
          retention-days: 14

      - name: Create GitHub Release (On Tag or Dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: iGames ${{ github.ref_name || github.event.inputs.release_version }}
          tag_name: ${{ github.ref_name || github.event.inputs.release_version }}
          files: build-apks/*.apk
          draft: false
          prerelease: false
          body: |
            ## 🎮 iGames 儿童启蒙游戏合集

            ### 🚀 本次更新包含：
            - 🚦 **红绿灯模拟器**：拟真外观、标准三色灯、倒计时数显、行人行走小人
            - ⚙️ **时长自定义设置**：红灯、绿灯、黄灯秒数灵活调节，带儿童防误触锁
            - 🔊 **童趣语音与音效**：红灯停、绿灯行，黄灯等一等
            - 🎮 **小交警过马路启蒙闯关互动游戏**
            
            ### 📱 安装指南：
            下载下方的 `iGames-release.apk`，在安卓手机/平板上点击安装即可畅玩！
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
